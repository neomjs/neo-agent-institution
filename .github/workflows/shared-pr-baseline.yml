# Agent Institution owns only the event trigger, its permissions, the team roster input and the Skills
# release it calls. The called workflow owns every job, so their implementation cannot drift in this
# consumer. Product CI (ci.yml — the isolated and explicit-Brain suites) stays a separate workflow:
# governance never gates the build.

name: Shared PR Baseline

# The called workflow's PR-body job reads the pull request live (never the event snapshot), so it
# declares `pull-requests: read` for itself — and a called job may not hold more than its caller
# grants: with `contents: read` alone the run fails at startup before any job exists (measured on
# this repository's first caller run). Both grants stay read-only.
permissions:
  contents: read
  pull-requests: read

# Deliberately unfiltered by branch or path: once these jobs become required contexts, every PR
# must emit a terminal result — the called PR-base job rejects an unsupported base instead of
# leaving a context pending. The activity types are explicit because the callee reads the pull
# request LIVE and says so in its own header: a body-only `edited` and a draft's `ready_for_review`
# must re-run the gate, and GitHub's default set carries neither.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  baseline:
    name: Shared PR Baseline
    # The published Skills release this repository is judged by, named by its tag and never by a commit
    # SHA: the called workflow installs the same npm version, and dependabot moves the tag on each release.
    uses: neomjs/neo-agent-skills/.github/workflows/reusable-pr-baseline.yml@v0.1.17
    # The team roster tells the commit-authorship job whose commits are an agent's; without it the job
    # checks nothing. It is read from the Brain's `dev`, never from the pull request under review.
    with:
      team_roster_repository: neomjs/neo-agent-brain
      team_roster_path: ai/graph/agentCoAuthorEmails.mjs
